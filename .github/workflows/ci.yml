name: CI

on:
  push:
    branches: [main, feature/**, fix/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m black --check src tests migrations
      - run: python -m flake8 src tests
      - run: python -m mypy src
      - run: python -m pytest -q tests/unit tests/api

  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: tender_lens_test
          POSTGRES_USER: tender_lens
          POSTGRES_PASSWORD: tender_lens
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U tender_lens -d tender_lens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RUN_INTEGRATION: "1"
      TEST_DATABASE_URL: postgresql+asyncpg://tender_lens:tender_lens@localhost:55432/tender_lens_test
      TEST_NATS_URL: nats://localhost:54222
      DATABASE_URL: postgresql+asyncpg://tender_lens:tender_lens@localhost:55432/tender_lens_test
      AI_MODE: fake
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - name: Start NATS JetStream
        run: |
          docker rm -f tender-lens-nats >/dev/null 2>&1 || true
          docker run -d --name tender-lens-nats -p 127.0.0.1::4222 nats:2.10-alpine -js
          nats_port=$(docker inspect --format='{{(index (index .NetworkSettings.Ports "4222/tcp") 0).HostPort}}' tender-lens-nats)
          echo "NATS_TEST_PORT=${nats_port}" >> "$GITHUB_ENV"
          echo "TEST_NATS_URL=nats://127.0.0.1:${nats_port}" >> "$GITHUB_ENV"
      - name: Wait for NATS
        run: |
          python - <<'PY'
          import os
          import socket
          import time

          port = int(os.environ["NATS_TEST_PORT"])
          deadline = time.monotonic() + 30
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", port), timeout=1):
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("NATS did not become ready in 30 seconds")
          PY
      - name: Apply migration from a clean database
        run: python -m alembic upgrade head
      - run: python -m pytest -q -m integration tests/integration
      - run: python -m pytest -q -m e2e tests/e2e
      - name: Verify reversible migration
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Stop NATS
        if: always()
        run: docker rm -f tender-lens-nats >/dev/null 2>&1 || true

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker build -t tender-lens:ci .
      - name: Smoke application roles
        run: |
          test "$(docker inspect tender-lens:ci --format '{{.Config.User}}')" = "app"
          docker run --rm tender-lens:ci python -m tender_lens.crawler --help
          docker run --rm tender-lens:ci python -m tender_lens.indexer --help
          docker run --rm tender-lens:ci python -c "from tender_lens.api.main import create_app; assert create_app().title == 'TenderLens API'"
