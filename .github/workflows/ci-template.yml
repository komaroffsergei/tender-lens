name: CI template

# Этот файл — проверяемый ориентир. Codex должен создать итоговый ci.yml,
# согласованный с фактическим lock-файлом, командами Makefile и test markers.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras
      - name: Black
        run: uv run black --check .
      - name: Flake8
        run: uv run flake8 src tests
      - name: Mypy
        run: uv run mypy src
      - name: Unit tests
        run: uv run pytest -q tests/unit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tender_lens
          POSTGRES_PASSWORD: tender_lens
          POSTGRES_DB: tender_lens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tender_lens -d tender_lens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://tender_lens:tender_lens@127.0.0.1:5432/tender_lens_test
      NATS_URL: nats://127.0.0.1:4222
      AI_MODE: fake
      ATTACHMENTS_DIR: ${{ github.workspace }}/.tmp/attachments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras
      - name: Start NATS with JetStream
        run: |
          docker run -d --name tender-lens-nats \
            -p 4222:4222 -p 8222:8222 \
            nats:2.10-alpine -js -m 8222
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8222/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs tender-lens-nats
          exit 1
      - name: Prepare test directories
        run: mkdir -p .tmp/attachments
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Integration and e2e tests
        run: uv run pytest -q tests/integration tests/e2e

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config
      - name: Build one application image
        run: docker build -t tender-lens:ci .
      - name: Smoke role entry points
        run: |
          docker run --rm tender-lens:ci python -m tender_lens.crawler --help
          docker run --rm tender-lens:ci python -m tender_lens.indexer --help
          docker run --rm tender-lens:ci python -m tender_lens.cli --help
