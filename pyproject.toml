[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-lens"
version = "0.1.0"
description = "Асинхронный мониторинг закупок с NATS JetStream, pgvector и локальным RAG"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Сергей Комаров"}]
dependencies = [
  "alembic==1.18.4",
  "asyncpg==0.31.0",
  "defusedxml==0.7.1",
  "fastapi==0.128.2",
  "httpx==0.28.1",
  "nats-py==2.15.0",
  "pgvector==0.5.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "pypdf==5.9.0",
  "sqlalchemy==2.0.50",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
dev = [
  "black==25.1.0",
  "flake8==7.3.0",
  "mypy==1.18.2",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "jsonschema==4.26.0",
]

[project.scripts]
tender-lens = "tender_lens.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tender_lens = ["web/*.html", "web/*.css", "web/*.js"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: требует PostgreSQL/pgvector и, при необходимости, NATS",
  "e2e: полный fixture-конвейер",
  "live: обращается к реальным внешним сервисам и не запускается в CI",
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["nats.*", "pgvector.*", "pypdf.*"]
ignore_missing_imports = true
