name: tender-lens

x-app: &app
  build:
    context: .
  env_file:
    - .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    nats:
      condition: service_healthy
  volumes:
    - attachments_data:/data/attachments

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tender_lens
      POSTGRES_USER: tender_lens
      POSTGRES_PASSWORD: tender_lens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender_lens -d tender_lens"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *app
    command: ["uvicorn", "tender_lens.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20

  crawler:
    <<: *app
    command: ["python", "-m", "tender_lens.crawler"]

  indexer:
    <<: *app
    command: ["python", "-m", "tender_lens.indexer"]

volumes:
  postgres_data:
  nats_data:
  ollama_data:
  attachments_data:
