name: tender-lens

x-app: &app
  build:
    context: .
  env_file:
    - .env
  environment:
    # Shell override нужен demo/live scripts; остальные значения приходят из .env.
    AI_MODE: ${AI_MODE:-fake}
  restart: unless-stopped
  volumes:
    - attachments_data:/data/attachments

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tender_lens
      POSTGRES_USER: tender_lens
      POSTGRES_PASSWORD: tender_lens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender_lens -d tender_lens"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data

  ollama:
    image: ollama/ollama:0.32.6
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  model-init:
    image: ollama/ollama:0.32.6
    profiles: ["ai"]
    restart: "no"
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama pull $${EMBEDDING_MODEL:-qwen3-embedding:0.6b} &&
        ollama pull $${GENERATION_MODEL:-qwen3:1.7b}

  migrate:
    <<: *app
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "tender_lens.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20

  crawler:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    command: ["python", "-m", "tender_lens.crawler"]

  indexer:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    command: ["python", "-m", "tender_lens.indexer"]

volumes:
  postgres_data:
  nats_data:
  ollama_data:
  attachments_data:
